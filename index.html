<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>PMI Capture</title>
<style>
  :root{
    --bg:#0f1117; --card:#1e2130; --line:#2c3142; --text:#e5e7eb;
    --dim:#8b93a7; --accent:#4f8cff; --ok:#34d399; --warn:#fbbf24; --bad:#f87171;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  body{padding:env(safe-area-inset-top) 14px calc(env(safe-area-inset-bottom) + 20px)}
  header{display:flex;align-items:center;justify-content:space-between;
    padding:14px 0 10px;position:sticky;top:0;background:var(--bg);z-index:5}
  h1{font-size:17px;margin:0;letter-spacing:.2px}
  .who{background:var(--card);border:1px solid var(--line);color:var(--text);
    border-radius:9px;padding:7px 10px;font-size:14px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 14px}
  button.act{appearance:none;border:1px solid var(--line);background:var(--card);
    color:var(--text);border-radius:14px;padding:20px 12px;font-size:15px;font-weight:600;
    display:flex;flex-direction:column;align-items:center;gap:8px;min-height:104px;
    justify-content:center;transition:transform .06s ease,background .15s}
  button.act:active{transform:scale(.97);background:#262b3d}
  button.act .ico{font-size:26px;line-height:1}
  button.act .sub{font-size:11px;font-weight:400;color:var(--dim);text-align:center}
  button.wide{grid-column:1 / -1;min-height:64px;flex-direction:row;gap:10px}
  button.rec{background:#3b1d24;border-color:#7f2d3b}
  .status{border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:14px;
    border:1px solid var(--line);background:var(--card);display:none}
  .status.show{display:block}
  .status.ok{border-color:#1f6f52} .status.err{border-color:#7f2d3b}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid var(--dim);
    border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;
    vertical-align:-2px;margin-right:7px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .pending{font-size:13px;color:var(--warn);margin-bottom:10px;display:none}
  .pending.show{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .pending button{background:none;border:1px solid var(--warn);color:var(--warn);
    border-radius:8px;padding:5px 11px;font-size:12px}
  h2{font-size:12px;text-transform:uppercase;letter-spacing:.9px;color:var(--dim);
    margin:20px 0 8px;font-weight:600}
  .row{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:11px 13px;margin-bottom:8px}
  .row .nm{font-weight:600;font-size:15px}
  .row .co{color:var(--dim);font-size:13px;margin-top:1px}
  .row .ex{font-size:13px;margin-top:7px;color:#c3cad9;white-space:pre-wrap}
  .row .tm{font-size:11px;color:var(--dim);margin-top:6px}
  dialog{background:var(--card);color:var(--text);border:1px solid var(--line);
    border-radius:16px;padding:18px;width:min(92vw,420px)}
  dialog::backdrop{background:rgba(0,0,0,.65)}
  dialog label{display:block;font-size:12px;color:var(--dim);margin:10px 0 5px}
  dialog input,dialog textarea{width:100%;background:var(--bg);border:1px solid var(--line);
    color:var(--text);border-radius:9px;padding:11px;font-size:16px;font-family:inherit}
  dialog textarea{min-height:110px;resize:vertical}
  .drow{display:flex;gap:9px;margin-top:16px}
  .drow button{flex:1;border-radius:10px;padding:12px;font-size:15px;font-weight:600;
    border:1px solid var(--line);background:var(--bg);color:var(--text)}
  .drow button.go{background:var(--accent);border-color:var(--accent);color:#fff}
  .timer{font-variant-numeric:tabular-nums;font-size:34px;text-align:center;
    margin:10px 0 4px;font-weight:600}
  .hint{font-size:12px;color:var(--dim);text-align:center;margin-bottom:4px}
  input[type=file]{display:none}
  .row{cursor:pointer}
  .row:active{background:#262b3d}
  .row .more{font-size:11px;color:var(--accent);margin-top:6px}
  .pname{font-size:19px;font-weight:700}
  .pco{color:var(--dim);font-size:13px;margin-bottom:4px}
  #dlgPerson{max-height:82vh;overflow-y:auto}
  .sect{margin-top:15px}
  .sect h3{font-size:11px;text-transform:uppercase;letter-spacing:.9px;
    color:var(--dim);margin:0 0 5px;font-weight:600}
  .sect .body{font-size:14px;line-height:1.5;white-space:pre-wrap;color:#dfe4ee}
  .sect .body b{color:#fff}
  .drow button.danger{background:#3b1d24;border-color:#7f2d3b;color:#ffb4be;flex:0 0 38%}
</style>
</head>
<body>

<header>
  <h1>PMI Summit capture</h1>
  <select class="who" id="who"></select>
</header>

<div class="pending" id="pending">
  <span id="pendingTxt"></span><button id="retry">Retry now</button>
</div>

<div class="status" id="status"></div>

<div class="grid">
  <button class="act" id="bBadge">
    <span class="ico">📷</span>Scan badge
    <span class="sub">Name, company, title + brief</span>
  </button>
  <button class="act" id="bPerson">
    <span class="ico">➕</span>Add by name
    <span class="sub">No badge to photograph</span>
  </button>
  <button class="act" id="bDebrief">
    <span class="ico">🎙️</span>Voice debrief
    <span class="sub">You, talking, right after</span>
  </button>
  <button class="act rec" id="bConvo">
    <span class="ico">🔴</span>Record convo
    <span class="sub">Tell them first</span>
  </button>
  <button class="act wide" id="bNote">
    <span class="ico">✍️</span>Type a note
  </button>
</div>

<h2>Your captures today</h2>
<div id="list"><div class="row"><div class="co">Nothing yet.</div></div></div>

<input type="file" id="fileBadge" accept="image/*" capture="environment">

<dialog id="dlgText">
  <div style="font-weight:600" id="dlgTitle">Note</div>
  <div id="dlgFields"></div>
  <div class="drow">
    <button id="dlgCancel">Cancel</button>
    <button class="go" id="dlgSave">Save</button>
  </div>
</dialog>

<dialog id="dlgPerson">
  <div class="pname" id="pName"></div>
  <div class="pco" id="pCo"></div>
  <div id="pBody"></div>
  <div class="drow">
    <button id="pDelete" class="danger">Delete</button>
    <button class="go" id="pClose">Close</button>
  </div>
</dialog>

<dialog id="dlgRec">
  <div style="font-weight:600;text-align:center" id="recTitle">Recording</div>
  <div class="timer" id="recTimer">0:00</div>
  <div class="hint" id="recHint"></div>
  <div class="drow">
    <button id="recCancel">Discard</button>
    <button class="go" id="recStop">Stop &amp; send</button>
  </div>
</dialog>

<script>
(function(){
"use strict";

/* Absolute, because this page is served from GitHub Pages rather than from
   n8n. n8n webhooks return permissive CORS headers (it echoes the Origin and
   answers the preflight), so cross-origin calls need nothing extra here.

   The page CANNOT be served from n8n itself: n8n stamps every webhook response
   with `Content-Security-Policy: sandbox ...` and omits allow-same-origin,
   which makes the document an opaque origin. fetch still works there, but
   getUserMedia, localStorage and IndexedDB are all dead, so the microphone
   could never be granted and nothing could be queued offline. */
var API   = "https://process-street.app.n8n.cloud/webhook";
var PEOPLE = ["Blake","Gustavo","Lincoln"];

var $ = function(id){ return document.getElementById(id); };

/* Safari in Private Browsing throws on localStorage rather than returning
   null. Reading it unguarded at startup would kill the whole script and leave
   a dead page at the booth, so every access is wrapped. */
function lsGet(k){ try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v){ try { localStorage.setItem(k, v); } catch (e) {} }

var who = lsGet("pmi_who") || "";

/* ---------- capturer picker ---------- */
var sel = $("who");
PEOPLE.forEach(function(p){
  var o = document.createElement("option");
  o.value = p; o.textContent = p; sel.appendChild(o);
});
if (!who) { who = PEOPLE[0]; }
sel.value = who;
lsSet("pmi_who", who);
sel.onchange = function(){
  who = sel.value;
  lsSet("pmi_who", who);
  render();
  refresh();
};

/* ---------- status line ---------- */
var statusEl = $("status"), statusTimer = null;
function status(msg, kind, sticky){
  clearTimeout(statusTimer);
  statusEl.className = "status show" + (kind ? " " + kind : "");
  statusEl.innerHTML = msg;
  if (!sticky) {
    statusTimer = setTimeout(function(){ statusEl.className = "status"; }, 6000);
  }
}
function busy(msg){ status('<span class="spin"></span>' + msg, "", true); }

/* ---------- offline queue (IndexedDB, blobs are too big for localStorage) ---------- */
var db = null;
function openDB(){
  return new Promise(function(res){
    var r;
    /* Same story as localStorage: blocked site data can throw outright. */
    try { r = indexedDB.open("pmiq", 1); } catch (e) { return res(null); }
    if (!r) { return res(null); }
    r.onupgradeneeded = function(e){
      e.target.result.createObjectStore("q", { keyPath:"id", autoIncrement:true });
    };
    r.onsuccess = function(e){ db = e.target.result; res(db); };
    r.onerror = function(){ res(null); };
  });
}
function tx(mode){ return db.transaction("q", mode).objectStore("q"); }
function qAdd(item){
  return new Promise(function(res){
    if (!db) return res();
    var rq = tx("readwrite").add(item);
    rq.onsuccess = rq.onerror = function(){ res(); };
  });
}
function qAll(){
  return new Promise(function(res){
    if (!db) return res([]);
    var rq = tx("readonly").getAll();
    rq.onsuccess = function(){ res(rq.result || []); };
    rq.onerror = function(){ res([]); };
  });
}
function qDel(id){
  return new Promise(function(res){
    if (!db) return res();
    var rq = tx("readwrite").delete(id);
    rq.onsuccess = rq.onerror = function(){ res(); };
  });
}
function showPending(){
  qAll().then(function(items){
    var el = $("pending");
    if (!items.length) { el.className = "pending"; return; }
    el.className = "pending show";
    $("pendingTxt").textContent = items.length + " capture" +
      (items.length > 1 ? "s" : "") + " waiting for signal";
  });
}
$("retry").onclick = function(){ drain(true); };

var draining = false;
function drain(loud){
  if (draining || !db) return;
  draining = true;
  qAll().then(function(items){
    var chain = Promise.resolve(), sent = 0;
    items.forEach(function(it){
      chain = chain.then(function(){
        return send(it.path, it.body, it.headers, true).then(function(){
          sent++;
          return qDel(it.id);
        }).catch(function(){});
      });
    });
    return chain.then(function(){
      draining = false;
      showPending();
      if (sent) {
        if (loud) status(sent + " queued capture" + (sent>1?"s":"") + " sent.", "ok");
        refresh();
      } else if (loud) {
        status("Still no connection.", "err");
      }
    });
  });
}
window.addEventListener("online", function(){ drain(false); });
document.addEventListener("visibilitychange", function(){
  if (!document.hidden) { drain(false); refresh(); }
});

/* ---------- transport ---------- */
/* Payloads go up as base64 inside JSON. That is what the IRES scanner already
   proved over a phone hotspot, and it keeps n8n off binary-webhook behaviour. */
function toB64(blob){
  return new Promise(function(res, rej){
    var fr = new FileReader();
    fr.onload = function(){
      var s = String(fr.result);
      res(s.slice(s.indexOf(",") + 1));
    };
    fr.onerror = rej;
    fr.readAsDataURL(blob);
  });
}
function send(path, body, headers, noQueue){
  var ctl = new AbortController();
  var t = setTimeout(function(){ ctl.abort(); }, 45000);
  return fetch(API + path, {
    method:"POST", body:body, headers:headers || {}, signal:ctl.signal
  }).then(function(r){
    clearTimeout(t);
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json().catch(function(){ return {}; });
  }).catch(function(err){
    clearTimeout(t);
    if (!noQueue) {
      return qAdd({ path:path, body:body, headers:headers || {} }).then(function(){
        showPending();
        throw new Error("queued");
      });
    }
    throw err;
  });
}
function q(extra){
  var s = "?capturer=" + encodeURIComponent(who);
  for (var k in extra) { s += "&" + k + "=" + encodeURIComponent(extra[k]); }
  return s;
}
function failed(err){
  if (err && err.message === "queued") {
    status("No signal. Saved on your phone, it will send itself.", "err");
  } else {
    status("Failed: " + (err && err.message ? err.message : "unknown"), "err");
  }
}

/* ---------- badge photo ---------- */
$("bBadge").onclick = function(){ $("fileBadge").click(); };
$("fileBadge").onchange = function(e){
  var f = e.target.files && e.target.files[0];
  e.target.value = "";
  if (!f) return;
  busy("Reading badge&hellip;");
  shrink(f).then(toB64).then(function(b64){
    return send("/pmi-badge" + q(), JSON.stringify({ image:b64 }),
                { "Content-Type":"application/json" });
  }).then(function(r){
    status("Got <b>" + esc(r.name || "badge") + "</b>" +
           (r.company ? " · " + esc(r.company) : ""), "ok");
    return refresh().then(function(){
      if (rows.length) { openPerson(rows[rows.length - 1].row); }
    });
  }).catch(failed);
};

/* Downscale so a photo moves over a hotspot in a couple of seconds. */
function shrink(file){
  return new Promise(function(res){
    var img = new Image(), url = URL.createObjectURL(file);
    img.onload = function(){
      var max = 1600, w = img.width, h = img.height;
      var s = Math.min(1, max / Math.max(w, h));
      var c = document.createElement("canvas");
      c.width = Math.round(w * s); c.height = Math.round(h * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(function(b){ res(b || file); }, "image/jpeg", 0.82);
    };
    img.onerror = function(){ URL.revokeObjectURL(url); res(file); };
    img.src = url;
  });
}

/* ---------- audio ---------- */
var rec = null, chunks = [], recTick = null, recMode = "debrief", recStart = 0;

function startRec(mode){
  recMode = mode;
  if (!navigator.mediaDevices || !window.MediaRecorder) {
    status("This browser cannot record audio. Use Type a note.", "err");
    return;
  }
  navigator.mediaDevices.getUserMedia({ audio:true }).then(function(stream){
    var opts = {};
    ["audio/mp4","audio/webm;codecs=opus","audio/webm"].some(function(m){
      if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) {
        opts.mimeType = m; return true;
      }
      return false;
    });
    rec = new MediaRecorder(stream, opts);
    chunks = [];
    rec.ondataavailable = function(e){ if (e.data.size) chunks.push(e.data); };
    rec.onstop = function(){ stream.getTracks().forEach(function(t){ t.stop(); }); };
    rec.start();
    recStart = Date.now();

    $("recTitle").textContent = mode === "debrief" ? "Voice debrief" : "Recording conversation";
    $("recHint").textContent = mode === "debrief"
      ? "Who, company, pillar, what they want, what you promised, hot or warm."
      : "Make sure they know they are being recorded.";
    $("recTimer").textContent = "0:00";
    $("dlgRec").showModal();
    recTick = setInterval(function(){
      var s = Math.floor((Date.now() - recStart) / 1000);
      $("recTimer").textContent = Math.floor(s/60) + ":" + ("0" + (s%60)).slice(-2);
    }, 250);
  }).catch(function(){
    status("Microphone blocked. Allow it in Settings, or type a note.", "err");
  });
}
function endRec(keep){
  clearInterval(recTick);
  $("dlgRec").close();
  if (!rec) return;
  var mr = rec; rec = null;
  mr.onstop = function(){
    mr.stream.getTracks().forEach(function(t){ t.stop(); });
    if (!keep || !chunks.length) { chunks = []; return; }
    var type = mr.mimeType || "audio/mp4";
    var blob = new Blob(chunks, { type:type });
    chunks = [];
    var ext = type.indexOf("mp4") >= 0 ? "m4a" : "webm";
    busy("Transcribing&hellip;");
    toB64(blob).then(function(b64){
      return send("/pmi-audio" + q({ mode:recMode, ext:ext }),
                  JSON.stringify({ audio:b64, mime:type, ext:ext }),
                  { "Content-Type":"application/json" });
    }).then(function(r){
        status("Saved to <b>" + (r.name || "your last person") + "</b>." +
          (r.extracted ? "<br><span style='color:var(--dim);font-size:13px'>" +
            esc(r.extracted).slice(0,180) + "</span>" : ""), "ok");
        refresh();
      }).catch(failed);
  };
  mr.stop();
}
$("bDebrief").onclick = function(){ startRec("debrief"); };
$("bConvo").onclick   = function(){ startRec("conversation"); };
$("recStop").onclick   = function(){ endRec(true); };
$("recCancel").onclick = function(){ endRec(false); };

/* ---------- text dialogs ---------- */
var dlgSubmit = null;
function askText(title, fields, onSave){
  $("dlgTitle").textContent = title;
  var host = $("dlgFields");
  host.innerHTML = "";
  fields.forEach(function(f){
    var l = document.createElement("label"); l.textContent = f.label;
    var i = document.createElement(f.multiline ? "textarea" : "input");
    i.id = "f_" + f.key;
    if (!f.multiline) { i.type = "text"; i.autocapitalize = "words"; }
    host.appendChild(l); host.appendChild(i);
  });
  dlgSubmit = function(){
    var out = {};
    fields.forEach(function(f){ out[f.key] = ($("f_" + f.key).value || "").trim(); });
    $("dlgText").close();
    onSave(out);
  };
  $("dlgText").showModal();
  setTimeout(function(){ var e = $("f_" + fields[0].key); if (e) e.focus(); }, 60);
}
$("dlgSave").onclick   = function(){ if (dlgSubmit) dlgSubmit(); };
$("dlgCancel").onclick = function(){ $("dlgText").close(); };

$("bPerson").onclick = function(){
  askText("Add by name", [
    { key:"name",    label:"Name" },
    { key:"company", label:"Company or franchise" }
  ], function(v){
    if (!v.name && !v.company) return;
    busy("Saving&hellip;");
    send("/pmi-person" + q(), JSON.stringify(v), { "Content-Type":"application/json" })
      .then(function(){
        status("Added <b>" + esc(v.name || v.company) + "</b>.", "ok");
        refresh();
      }).catch(failed);
  });
};

$("bNote").onclick = function(){
  askText("Note on your last person", [
    { key:"note", label:"What was said, what you promised, next step", multiline:true }
  ], function(v){
    if (!v.note) return;
    busy("Saving&hellip;");
    send("/pmi-note" + q(), JSON.stringify(v), { "Content-Type":"application/json" })
      .then(function(){ status("Note saved.", "ok"); refresh(); })
      .catch(failed);
  });
};

/* ---------- list ---------- */
var rows = [];
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>]/g, function(c){
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;" }[c];
  });
}
function render(){
  var host = $("list");
  if (!rows.length) {
    host.innerHTML = '<div class="row"><div class="co">Nothing yet.</div></div>';
    return;
  }
  host.innerHTML = rows.slice().reverse().map(function(r){
    var extra = r.extracted || r.note || "";
    return '<div class="row" data-row="' + r.row + '">' +
      '<div class="nm">' + esc(r.name || "Unnamed") + '</div>' +
      '<div class="co">' + esc([r.title, r.company].filter(Boolean).join(" · ")) + '</div>' +
      (extra ? '<div class="ex">' + esc(extra).slice(0, 200) + '</div>' : "") +
      '<div class="tm">' + esc(r.time || "") + '</div>' +
      (r.card ? '<div class="more">Tap for talking points</div>' : "") +
    '</div>';
  }).join("");
}

/* ---------- person detail: talking points, and delete ---------- */
var openRow = null;

/* The badge brief comes back as **bold** run-on markdown. Split it into its
   labelled sections so it can be skimmed while someone is standing there. */
function sections(card){
  var parts = String(card).split(/\*\*(.+?)\*\*/g);
  var out = "", lead = (parts.shift() || "").trim();
  if (lead) { out += '<div class="sect"><div class="body">' + esc(lead) + '</div></div>'; }
  for (var i = 0; i + 1 < parts.length; i += 2) {
    out += '<div class="sect"><h3>' + esc(parts[i]) + '</h3>' +
           '<div class="body">' + esc((parts[i + 1] || "").trim()) + '</div></div>';
  }
  return out || '<div class="sect"><div class="body">' + esc(card) + '</div></div>';
}

function openPerson(rowNum){
  var r = null;
  for (var i = 0; i < rows.length; i++) { if (rows[i].row === rowNum) { r = rows[i]; } }
  if (!r) return;
  openRow = r.row;

  $("pName").textContent = r.name || "Unnamed";
  $("pCo").textContent = [r.title, r.company].filter(Boolean).join(" · ");

  var html = "";
  if (r.card) { html += sections(r.card); }
  if (r.extracted) {
    html += '<div class="sect"><h3>From your debrief</h3><div class="body">' +
            esc(r.extracted) + '</div></div>';
  }
  if (r.note) {
    html += '<div class="sect"><h3>Your note</h3><div class="body">' +
            esc(r.note) + '</div></div>';
  }
  if (r.transcript) {
    html += '<div class="sect"><h3>Transcript</h3><div class="body">' +
            esc(r.transcript) + '…</div></div>';
  }
  if (!html) {
    html = '<div class="sect"><div class="body">Nothing captured for this ' +
           'person yet. Add a voice debrief or a note.</div></div>';
  }
  $("pBody").innerHTML = html;
  $("dlgPerson").showModal();
  $("dlgPerson").scrollTop = 0;
}

$("list").addEventListener("click", function(e){
  var el = e.target.closest ? e.target.closest(".row[data-row]") : null;
  if (el) { openPerson(parseInt(el.getAttribute("data-row"), 10)); }
});
$("pClose").onclick = function(){ $("dlgPerson").close(); };

$("pDelete").onclick = function(){
  if (openRow === null) return;
  var name = $("pName").textContent;
  if (!confirm("Delete " + name + "? This removes the row and bins the photo " +
               "and recording.")) { return; }
  var target = openRow;
  $("dlgPerson").close();
  busy("Deleting&hellip;");
  /* Deletes are never queued offline: row numbers shift as rows go, so a
     stale queued delete could remove the wrong person later. */
  send("/pmi-delete" + q({ row: target }), JSON.stringify({ row: target }),
       { "Content-Type": "application/json" }, true)
    .then(function(){ status("Deleted " + esc(name) + ".", "ok"); refresh(); })
    .catch(function(){ status("Could not delete, you need a connection.", "err"); });
};
function refresh(){
  return fetch(API + "/pmi-list" + q(), { method:"GET" })
    .then(function(r){ return r.json(); })
    .then(function(d){ rows = (d && d.rows) || []; render(); })
    .catch(function(){});
}

/* ---------- go ---------- */
openDB().then(function(){
  showPending();
  drain(false);
  refresh();
});
setInterval(function(){ drain(false); }, 60000);
})();
</script>
